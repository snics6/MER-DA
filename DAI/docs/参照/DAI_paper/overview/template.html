<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a research ledger. Sticky contents on the left, one reading column, wide tables scroll inside their own box. */
:root {
  --paper: #f6f7f9;
  --panel: #ffffff;
  --ink: #1b2230;
  --muted: #5a6476;
  --rule: #d8dde6;
  --accent: #2b5a88;
  --star: #a8700c;
  --star-bg: #fbf1dc;
  --ok: #2e7a4d;
  --warn: #b0520f;
  --pre: #646d7c;
  --design: #75489e;
  --pos: #eb6834;        /* position loss: categorical slot 2 */
  --dir: #2a78d6;        /* direction loss: categorical slot 1 */
  --emo-a: #1baf7a;      /* first emotion in figures: slot 3 */
  --emo-b: #8a8f98;      /* second emotion: neutral grey */
  --good: #0ca30c; --mid: #e09a00; --bad: #d03b3b;   /* status: icon + label always beside */
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13161c; --panel: #1a1e26; --ink: #e3e7ee; --muted: #9ba4b3; --rule: #2d333f;
    --accent: #85b3e2; --star: #e2b453; --star-bg: #3a2f17; --ok: #6cc28f; --warn: #eb9b58; --pre: #a3aab6; --design: #bf9ae6; --pos: #d95926; --dir: #3987e5; --emo-a: #199e70; --emo-b: #8d939c; --good: #0ca30c; --mid: #fab219; --bad: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13161c; --panel: #1a1e26; --ink: #e3e7ee; --muted: #9ba4b3; --rule: #2d333f;
  --accent: #85b3e2; --star: #e2b453; --star-bg: #3a2f17; --ok: #6cc28f; --warn: #eb9b58; --pre: #a3aab6; --design: #bf9ae6; --pos: #d95926; --dir: #3987e5; --emo-a: #199e70; --emo-b: #8d939c; --good: #0ca30c; --mid: #fab219; --bad: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.85;
  font-feature-settings: "palt" 0;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { display: grid; grid-template-columns: 1fr; gap: 0; max-width: 1280px; margin: 0 auto; }
@media (min-width: 1100px) { .wrap { grid-template-columns: 290px minmax(0, 1fr); gap: 40px; } }
nav.toc {
  padding: 20px 16px; border-bottom: 1px solid var(--rule); font-size: 13.5px; line-height: 1.6;
}
@media (min-width: 1100px) {
  nav.toc { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-bottom: 0; border-right: 1px solid var(--rule); padding: 28px 18px 40px 16px; }
}
nav.toc .brand { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: 0.04em; margin: 0 0 4px; }
nav.toc .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
nav.toc ul { list-style: none; padding-left: 0; margin: 0; }
nav.toc ul ul { padding-left: 14px; margin: 2px 0 6px; }
nav.toc li { margin: 3px 0; }
nav.toc a { color: var(--ink); text-decoration: none; }
nav.toc a:hover { color: var(--accent); text-decoration: underline; }
nav.toc ul ul a { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
button.toggle {
  font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--star); background: var(--panel); color: var(--ink);
}
button.toggle[aria-pressed="true"] { background: var(--star-bg); }
main { padding: 24px 16px 120px; min-width: 0; }
.col { max-width: 860px; }
header.doc h1 { font-family: var(--font-display); font-size: 38px; line-height: 1.25; margin: 8px 0 6px; text-wrap: balance; }
header.doc p { color: var(--muted); margin: 0 0 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); margin: 14px 0 28px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
h1, h2, h3, h4, h5 { text-wrap: balance; }
main h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.3; margin: 72px 0 16px; padding-top: 18px; border-top: 3px solid var(--ink); }
main h2 { font-family: var(--font-display); font-size: 23px; line-height: 1.4; margin: 48px 0 12px; }
main h3 { font-size: 18px; margin: 34px 0 8px; }
main h4 { font-size: 16px; margin: 26px 0 6px; color: var(--muted); }
main h5 { font-size: 15px; margin: 20px 0 4px; }
p, li { max-width: 72ch; }
li { margin: 4px 0; }
code { font-family: var(--font-mono); font-size: 0.88em; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; word-break: break-all; }
pre { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; overflow-x: auto; }
pre code { border: 0; padding: 0; }
blockquote { margin: 16px 0; padding: 8px 16px; border-left: 4px solid var(--accent); background: var(--panel); }
.tw { overflow-x: auto; margin: 14px 0 20px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; font-size: 14px; line-height: 1.6; min-width: 100%; }
th, td { border-bottom: 1px solid var(--rule); padding: 7px 10px; vertical-align: top; text-align: left; }
th { background: color-mix(in srgb, var(--accent) 9%, var(--panel)); font-weight: 700; white-space: nowrap; }
td { font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.star { color: var(--star); font-weight: 700; }
.chip { display: inline-block; font-size: 12px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; margin: 0 2px; vertical-align: 1px; }
.chip.ok { color: var(--ok); }
.chip.pre { color: var(--pre); }
.chip.warn { color: var(--warn); }
.chip.design { color: var(--design); }
.matrix td, .matrix th { font-size: 14.5px; }
body.staronly main :is(p, li, tr, blockquote, .math.display):not(.has-star) { opacity: 0.32; }
body.staronly main :is(h1, h2, h3, h4, h5) { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { body main :is(p, li, tr) { transition: opacity 0.15s; } }
/* figure-first leads and folds */
.lead { margin: 6px 0 18px; }
.lead-claim { font-size: 17.5px; line-height: 1.85; margin: 8px 0 14px; }
.lead-note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--rule); padding-left: 10px; }
.fig { margin: 16px 0 18px; padding: 16px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; }
.fig figcaption { font-size: 13.5px; color: var(--muted); line-height: 1.7; margin-top: 12px; max-width: none; }
.eq { overflow-x: auto; max-width: none; }
details.fold { margin: 10px 0 20px; border: 1px solid var(--rule); border-radius: 10px; background: color-mix(in srgb, var(--panel) 60%, var(--paper)); }
details.fold > summary { cursor: pointer; padding: 10px 14px; font-weight: 700; color: var(--accent); list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; display: inline-block; width: 1.2em; transition: transform 0.15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
details.fold > .fold-body { padding: 0 16px 16px; }
details.fold > .fold-body > h2:first-child { margin-top: 18px; }
/* matrix (fig 0-1) */
.mx { display: grid; grid-template-columns: minmax(150px, 0.9fr) 1fr 1fr; gap: 6px; }
.mx p { margin: 0; max-width: none; }
.mx-corner { display: flex; align-items: flex-end; padding: 6px 8px; }
.mx-cap { font-size: 13px; color: var(--muted); font-weight: 700; }
.mx-ch { padding: 6px 8px 10px; border-bottom: 2px solid var(--ink); }
.mx-ch .icon { width: 120px; height: auto; display: block; margin-bottom: 4px; }
.mx-h { font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.4; }
.mx-def { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.mx-rh { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--rule); }
.mx-rh b { font-size: 15px; line-height: 1.45; }
.mx-n { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; }
.mx-sub { font-size: 12px; color: var(--muted); line-height: 1.5; }
.mx-rh.r4 b { color: var(--accent); }
.mx-c { padding: 10px 12px; border-radius: 8px; border-left: 5px solid; font-size: 13.5px; line-height: 1.65; display: flex; flex-direction: column; gap: 6px; }
.mx-c.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 9%, var(--panel)); }
.mx-c.mid { border-color: var(--mid); background: color-mix(in srgb, var(--mid) 10%, var(--panel)); }
.mx-c.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--panel)); }
.mx-c.key { box-shadow: 0 0 0 2px var(--good); }
.vd { font-weight: 700; font-size: 15px; }
.mx-st { font-size: 11.5px; color: var(--muted); }
.ub { display: flex; gap: 2px; height: 16px; border-radius: 4px; overflow: hidden; }
.ub-s { display: block; min-width: 3px; }
.ub-s.down, .k.down { background: var(--good); }
.ub-s.flat { background: color-mix(in srgb, var(--muted) 35%, var(--panel)); }
.ub-s.up, .k.up { background: var(--bad); }
.ub-l { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.k { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin: 0 4px 0 2px; }
.icon .dots-a circle, .pt.a { fill: var(--emo-a); }
.icon .dots-b circle, .pt.b { fill: var(--emo-b); }
.icon .best, svg .best { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.7; }
.icon .cut-pos, .icon .arrow-pos { stroke: var(--pos); stroke-width: 3; }
.icon .arrow-pos { stroke-width: 1.6; }
.icon .ah-pos { fill: var(--pos); }
.icon .cut-dir { stroke: var(--dir); stroke-width: 3; }
.icon .arc-dir { stroke: var(--dir); fill: none; stroke-width: 1.6; }
@media (max-width: 680px) {
  .mx { grid-template-columns: 1fr 1fr; }
  .mx-corner { display: none; }
  .mx-rh { grid-column: 1 / -1; }
}
/* two hills (fig 2-1) */
.hills-ctl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; margin-bottom: 12px; }
.hills-ctl label { font-size: 14px; white-space: nowrap; }
.hills-ctl output { font-variant-numeric: tabular-nums; font-weight: 700; margin-left: 8px; display: inline-block; min-width: 3.4em; }
.hills-ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.hills-ctl button { justify-self: start; grid-column: 1 / -1; border-color: var(--accent); }
.hills-panels { display: grid; grid-template-columns: 0.9fr 1fr; gap: 12px; }
@media (max-width: 680px) { .hills-panels { grid-template-columns: 1fr; } }
.hills-panels svg, .hills-bar svg { width: 100%; height: auto; display: block; }
.hills-key { font-size: 13px; color: var(--muted); max-width: none; margin: 6px 0; }
.k.a { background: var(--emo-a); border-radius: 50%; }
.k.b { background: var(--emo-b); border-radius: 50%; }
.k.hollow { border: 2px solid var(--muted); border-radius: 50%; background: transparent; }
.k.cutk { height: 3px; width: 16px; background: var(--ink); border-radius: 0; vertical-align: 3px; }
.k.bestk { height: 0; width: 16px; border-top: 2px dashed var(--ink); border-radius: 0; vertical-align: 3px; opacity: 0.7; }
.k.pos, .seg.pos { background: var(--pos); fill: var(--pos); }
.k.dir, .seg.dir { background: var(--dir); fill: var(--dir); }
.k.rest { background: color-mix(in srgb, var(--muted) 40%, var(--panel)); }
.seg.rest { fill: color-mix(in srgb, var(--muted) 40%, var(--panel)); }
.hills-read p { margin: 4px 0; font-size: 14.5px; max-width: none; }
.hills-read output, .hills-key output, .hills-bar-title output { font-variant-numeric: tabular-nums; }
.hills-bar-title { font-weight: 700; font-size: 14px; margin: 14px 0 2px; }
svg .frame { fill: none; stroke: var(--rule); }
svg .pt.wrong { fill: var(--panel); stroke-width: 2; }
svg .pt.a.wrong { stroke: var(--emo-a); }
svg .pt.b.wrong { stroke: var(--emo-b); }
svg .cut { stroke: var(--ink); stroke-width: 2.5; }
svg .lab { font-size: 12px; fill: var(--muted); }
svg .lab.strong { fill: var(--ink); font-weight: 700; }
svg .tick { font-size: 11px; fill: var(--muted); }
svg .axis { stroke: var(--muted); stroke-width: 1; }
svg .grid { stroke: var(--rule); stroke-width: 1; }
svg .ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.8; }
svg .hill.a { fill: color-mix(in srgb, var(--emo-a) 16%, transparent); }
svg .hill.b { fill: color-mix(in srgb, var(--emo-b) 18%, transparent); }
svg .err.a { fill: color-mix(in srgb, var(--emo-a) 70%, transparent); }
svg .err.b { fill: color-mix(in srgb, var(--emo-b) 75%, transparent); }
svg .edge { fill: none; stroke-width: 2; }
svg .edge.a { stroke: var(--emo-a); }
svg .edge.b { stroke: var(--emo-b); }
footer { color: var(--muted); font-size: 13px; margin-top: 80px; border-top: 1px solid var(--rule); padding-top: 12px; }
</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  svg: { fontCache: 'global' },
  startup: { typeset: true }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" defer></script>
</head>
<body>
<div class="wrap">
<nav class="toc" aria-label="目次">
<p class="brand">DAI</p>
<p class="sub">MER-DA の式・結果・考察の整理（$date$）</p>
<div class="controls"><button class="toggle" id="staronly" aria-pressed="false" type="button">☆ の項目だけを濃く表示する</button><button class="toggle" id="openall" aria-pressed="false" type="button">fold をすべて開く</button></div>
$toc$
</nav>
<main>
<div class="col">
$body$
<footer>MER-DA の文書から作った．作成 $date$，コミット $commit$．</footer>
</div>
</main>
</div>
<script>
(function () {
  var main = document.querySelector('main');
  main.querySelectorAll('.star').forEach(function (s) {
    var el = s.parentElement;
    while (el && el !== main) {
      if (el.matches('p, li, tr, blockquote, table, ul, ol, div, td, th')) el.classList.add('has-star');
      el = el.parentElement;
    }
  });
  function openFor(hash) {
    if (!hash || hash.length < 2) return;
    var el = document.getElementById(decodeURIComponent(hash.slice(1)));
    if (!el) return;
    var d = el.closest('details');
    while (d) { d.open = true; d = d.parentElement ? d.parentElement.closest('details') : null; }
    el.scrollIntoView();
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a) setTimeout(function () { openFor(a.getAttribute('href')); }, 0);
  });
  window.addEventListener('hashchange', function () { openFor(location.hash); });
  if (location.hash) openFor(location.hash);
  var ob = document.getElementById('openall');
  ob.addEventListener('click', function () {
    var on = ob.getAttribute('aria-pressed') !== 'true';
    document.querySelectorAll('details.fold').forEach(function (d) { d.open = on; });
    ob.setAttribute('aria-pressed', on ? 'true' : 'false');
    ob.textContent = on ? 'fold をすべて閉じる' : 'fold をすべて開く';
  });
  var btn = document.getElementById('staronly');
  btn.addEventListener('click', function () {
    var on = document.body.classList.toggle('staronly');
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
